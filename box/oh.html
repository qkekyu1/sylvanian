<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ㅋㅋ</title>

  <!-- oh.html이 box 폴더 안에 있으므로 ../css/oh.css -->
  <link rel="stylesheet" href="../css/oh.css">

  <!-- box/image/tlqkf.jpg -->
  <link rel="icon" href="./image/tlqkf.jpg">
</head>

<body>

  <!-- box/roblox-death-sound_1.mp3 -->
  <audio
    id="mySound"
    preload="auto"
    src="./roblox-death-sound_1.mp3">
  </audio>

  <div class="warning">
    <h1 id="warningText"></h1>
  </div>


  <script>
    // -------------------------
    // 경고 문구
    // -------------------------

    const message = "저기요... 잘못 들어오셨어요... ";

    const warningText = document.getElementById("warningText");

    // 문장을 100번 반복
    warningText.textContent = message.repeat(100);


    // -------------------------
    // 효과음
    // -------------------------

    const audio = document.getElementById("mySound");


    function playSound() {
      if (!audio) return;

      audio.currentTime = 0;

      audio.play()
        .then(() => {
          // 한 번 정상적으로 재생되면
          // 이벤트 제거
          window.removeEventListener("click", playSound);
          window.removeEventListener("touchstart", playSound);
          window.removeEventListener("keydown", playSound);
        })
        .catch(() => {
          // 브라우저가 자동재생을 막은 경우
          // 사용자의 클릭/터치/키보드 입력을 기다림
        });
    }


    // 페이지가 열리자마자 재생 시도
    playSound();


    // 자동재생이 막혔을 경우
    // 사용자가 화면을 클릭하면 재생
    window.addEventListener("click", playSound);

    // 모바일 터치
    window.addEventListener("touchstart", playSound);

    // 키보드 입력
    window.addEventListener("keydown", playSound);
  </script>

</body>
</html>
